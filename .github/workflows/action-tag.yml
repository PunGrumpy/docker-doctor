# The GitHub Action (action.yml + scripts/) is versioned independently of
# the CLI: the floating major tag (v1) moves whenever the action surface
# changes on main, so `uses: PunGrumpy/docker-doctor@v1` always resolves to
# the latest action release. Breaking changes get a new major tag, created
# manually (and this workflow's tag updated to match).

name: Action Tag

on:
  push:
    branches:
      - main
    paths:
      - action.yml
      - "scripts/**"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Smoke-test the action at this exact SHA before pointing every
      # consumer at it: scan a fixture with known findings and require a
      # non-empty result.
      - name: Smoke-test the action
        id: smoke
        uses: ./
        with:
          directory: packages/docker-doctor/test/fixtures/with-error
          blocking: none
          comment: "false"

      - name: Assert the smoke test produced results
        run: |
          if [ -z "${{ steps.smoke.outputs.score }}" ] || [ "${{ steps.smoke.outputs.total-issues }}" -lt 1 ]; then
            echo "::error::Action smoke test returned no results (score='${{ steps.smoke.outputs.score }}', total-issues='${{ steps.smoke.outputs.total-issues }}') — not moving v1"
            exit 1
          fi

      - name: Move the floating major tag
        run: |
          git tag -f v1
          git push -f origin v1
