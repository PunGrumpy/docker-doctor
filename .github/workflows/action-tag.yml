# The GitHub Action (action.yml + the comment renderer it runs) is versioned
# independently of the CLI, with two tag tiers (pattern adapted from
# millionco/react-doctor):
#
#   - immutable vX.Y.Z per release, bumped from the merged PR's conventional
#     title: feat → minor, everything else → patch
#   - floating major (v1, or v2 after a manual v2.0.0) moved forward to
#     each release in that major, so `uses: PunGrumpy/docker-doctor@v1`
#     resolves to the latest v1 release
#
# Breaking changes (feat!: / BREAKING CHANGE) fail this workflow on purpose.
# Cut the new major tag (v2.0.0) by hand. The next release after it moves
# the v2 floating tag.
#
# The floating major is read from the new tag (v2.0.1 moves v2). It only
# moves forward. When it cannot, the tag job fails instead of warning, so a
# stale @v1 is never hidden behind a green run. Re-running a failed run
# reuses the tag that run already pushed and retries the floating major.

name: Action Tag

on:
  push:
    branches:
      - main
    # Only the files the action runs. The rule docs generator and the kit
    # sync script also live in scripts/, and a change to them is not a change
    # to the action.
    paths:
      - action.yml
      - scripts/render-github-action-comment.mjs

# No default permissions. Each job declares its own.
permissions: {}

concurrency:
  group: action-tag
  cancel-in-progress: false

jobs:
  # The smoke test runs the published CLI through npx, which is code fetched
  # from npm at run time. It gets a read-only token and no stored
  # credentials, so nothing it runs can push a tag.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Smoke-test the action at this exact SHA before pointing every
      # consumer at it: scan a fixture with known findings and require a
      # non-empty result.
      - name: Smoke-test the action
        id: smoke
        uses: ./
        with:
          directory: packages/docker-doctor/test/fixtures/with-error
          blocking: none
          comment: "false"
          commit-status: "false"

      - name: Assert the smoke test produced results
        env:
          SMOKE_SCORE: ${{ steps.smoke.outputs.score }}
          SMOKE_TOTAL: ${{ steps.smoke.outputs.total-issues }}
        run: |
          if [ -z "$SMOKE_SCORE" ] || [ "$SMOKE_TOTAL" -lt 1 ]; then
            echo "::error::Action smoke test returned no results (score='$SMOKE_SCORE', total-issues='$SMOKE_TOTAL') — not tagging"
            exit 1
          fi

  tag:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Classify from the merged PR's title — a merge commit subject like
      # "Merge pull request #N" would silently downgrade every bump to a
      # patch. Fall back to the commit subject for direct pushes.
      - name: Classify the bump from the merged PR title
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].title // ""' 2>/dev/null || true)"
          [ -n "$subject" ] || subject="$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n1)"
          echo "Classifying: $subject"
          if printf '%s' "$subject" | grep -qiE '^[a-z]+(\([^)]*\))?!:' || printf '%s' "$subject" | grep -q 'BREAKING[ -]CHANGE'; then
            echo "::error::'$subject' is a breaking change. Cut the new major tag (for example v2.0.0) by hand. The next release after it moves the floating major."
            exit 1
          fi
          if printf '%s' "$subject" | grep -qiE '^feat(\([^)]*\))?:'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the next version from existing tags
        id: next
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          # A re-run of a run that already pushed its tag reuses that tag.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          if [ -n "$existing" ]; then
            echo "$existing already points at $GITHUB_SHA. Reusing it."
            echo "next=$existing" >> "$GITHUB_OUTPUT"
            echo "action=reuse" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          # A re-run of an old run must not give an older commit a newer
          # version than a release that already contains it.
          if [ -n "$latest" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest^{commit}"; then
            echo "::notice::$latest already contains $GITHUB_SHA. Nothing to tag."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            v="${latest#v}"
            maj="${v%%.*}"
            rest="${v#*.}"
            min="${rest%%.*}"
            pat="${rest#*.}"
            if [ "$LEVEL" = "minor" ]; then
              next="v${maj}.$((min + 1)).0"
            else
              next="v${maj}.${min}.$((pat + 1))"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists. Tags are immutable, so this run does not overwrite it."
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "action=create" >> "$GITHUB_OUTPUT"

      - name: Tag the release and move the floating major
        if: ${{ steps.next.outputs.action != 'skip' }}
        env:
          NEXT_TAG: ${{ steps.next.outputs.next }}
          ACTION: ${{ steps.next.outputs.action }}
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ACTION" = "create" ]; then
            git -c tag.gpgsign=false tag -a "$NEXT_TAG" -m "docker-doctor action $NEXT_TAG ($LEVEL)"
            git push origin "$NEXT_TAG"
          fi
          major="${NEXT_TAG%%.*}"
          if git rev-parse -q --verify "refs/tags/$major^{commit}" >/dev/null; then
            current="$(git rev-parse "refs/tags/$major^{commit}")"
            if [ "$current" = "$GITHUB_SHA" ]; then
              echo "$major already points at $NEXT_TAG."
              exit 0
            fi
            # Never move the floating major backwards. A re-run of an older
            # run finds it already ahead, and that is not an error.
            if git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
              echo "::notice::$major already points at a newer commit ($current). Left it there."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo "::error::$major points at $current, which is not in the history of $GITHUB_SHA. $NEXT_TAG is tagged but $major did not move, so @$major still runs the old commit. Move it by hand to $NEXT_TAG, then re-run this job."
              exit 1
            fi
          fi
          git -c tag.gpgsign=false tag -fa "$major" -m "docker-doctor action $major (floating major -> $NEXT_TAG)" "$GITHUB_SHA"
          git push -f origin "$major"
