name: Release

# Changesets v3 flow (https://changesets.dev/guide/automating):
#
#   select-mode  →  version   (changesets present: open/update the Version Packages PR)
#                →  pack      (none left, unpublished versions: build + tarball)
#                     →  publish  (npm via OIDC trusted publishing, then the kit + web deploy)
#
# Splitting the jobs keeps `id-token: write` on the publish job alone.

on:
  push:
    branches:
      - main

# Each job declares exactly what it needs.
permissions: {}

# One release at a time; never cancel a run that may already have published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SKIP_ENV_VALIDATION: "1"

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci') }}
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Version
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # changeset:version also resyncs bun.lock so the Version Packages
          # PR doesn't fail the Format CI job with a stale lockfile.
          script: bun run changeset:version
        env:
          HUSKY: "0"

  pack:
    name: Pack
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build --filter @docker-doctor/cli
      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release + git tag, and the kit re-pin commit below
      id-token: write # npm trusted publishing (also yields the provenance attestation)
    steps:
      # Credentials stay on disk here on purpose: the kit re-pin step pushes
      # a commit back to main.
      - name: Checkout
        uses: actions/checkout@v7
      # Node 24 bundles npm >= 11.5.1, the floor for trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish to npm
        id: publish
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      # Kit release: when a new CLI version reaches npm, re-pin the Docker
      # Sandboxes kit to it, bump the kit's own patch version, and push the
      # kit to Docker Hub in the same run. The kit versions independently of
      # the CLI (spec.yaml `version:`); manual bumps and kit-only changes go
      # through the Kit Push workflow (kit-push.yml).
      - name: Detect published CLI version
        id: cli
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          version="$(jq -r '.[] | select(.name == "@docker-doctor/cli") | .version' <<<"$PUBLISHED")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Re-pin kit and bump its patch version
        id: kit
        if: ${{ steps.cli.outputs.version != '' }}
        env:
          # The husky pre-commit hook (format + build) is pointless in CI and
          # leaves regenerated files unstaged, which then breaks the rebase.
          HUSKY: "0"
        run: |
          spec=kits/docker-doctor/spec.yaml
          sed -i "s#@docker-doctor/cli@[0-9.]*#@docker-doctor/cli@${{ steps.cli.outputs.version }}#" "$spec"
          if git diff --quiet "$spec"; then
            kit_version="$(awk -F'"' '/^version:/ { print $2; exit }' "$spec")"
            echo "Kit pin already at ${{ steps.cli.outputs.version }}; keeping kit version $kit_version"
          else
            current="$(awk -F'"' '/^version:/ { print $2; exit }' "$spec")"
            kit_version="$(echo "$current" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')"
            sed -i "s#^version: \"$current\"#version: \"$kit_version\"#" "$spec"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$spec"
            git commit -m "chore(kits): kit $kit_version — pin @docker-doctor/cli@${{ steps.cli.outputs.version }} [skip ci]"
            # main may have advanced while this run was publishing; autoStash
            # rides over any files earlier steps left modified in the tree
            # (rebase, not pull — the CI checkout is a detached HEAD)
            git fetch origin main
            git -c rebase.autoStash=true rebase FETCH_HEAD
            git push origin HEAD:main
          fi
          echo "version=$kit_version" >> "$GITHUB_OUTPUT"
      - name: Install Docker Sandboxes CLI
        if: ${{ steps.kit.outputs.version != '' }}
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          # docker-sbx is pinned: 0.39.0 changed `sbx kit push` to read only
          # the sbx credential store, which `docker login` does not populate
          # on a headless runner, so every push since 2026-08-19 failed with
          # "no default account profile set: secret not found". 0.42.0
          # advertises reading `docker login` credentials again — re-test and
          # unpin once it reaches the stable apt channel.
          sudo apt-get install -y "docker-sbx=0.38.0-1~ubuntu.24.04~noble"
      - name: Log in to Docker Hub
        if: ${{ steps.kit.outputs.version != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push kit to Docker Hub
        if: ${{ steps.kit.outputs.version != '' }}
        run: |
          sbx kit validate ./kits/docker-doctor
          sbx kit push ./kits/docker-doctor "docker.io/pungrumpy/docker-doctor-kit:${{ steps.kit.outputs.version }}"
          sbx kit push ./kits/docker-doctor docker.io/pungrumpy/docker-doctor-kit:latest
      # The web changelog page renders packages/docker-doctor/CHANGELOG.md at
      # build time. Vercel's own deploy for this push races the publish steps
      # above and may not even fire (the Version Packages commit touches no
      # file under apps/web), which is why the page used to need a manual
      # redeploy. Kick a fresh deploy of main once the release has fully landed.
      - name: Trigger web deploy
        # !cancelled(): the changelog page only needs the npm publish, so a
        # failed kit push earlier in the job must not skip this step (it did
        # for 0.4.4, leaving the page stale — the exact problem #98 fixed).
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping the web deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null
