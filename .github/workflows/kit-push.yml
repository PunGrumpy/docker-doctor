name: Kit Push

# The kit is a private workspace package (kits/docker-doctor/package.json)
# versioned by Changesets. It pins @docker-doctor/cli exactly, so every CLI
# release bumps the kit's patch version in the same Version Packages PR;
# kit-only changes ship with their own changeset. `bun run kit:sync` mirrors
# the version and the CLI pin into spec.yaml, the file that gets published.
#
#   - pull_request: fail if the kit changed without a changeset (the Version
#     Packages PR is exempt — it carries the bump itself) or spec.yaml drifted
#   - push to main: publish spec.yaml's version if its Docker Hub tag is new,
#     waiting for the pinned CLI to reach npm first (the Release workflow
#     publishes it from the same merge), and push latest again if it is
#     older than that version (a re-run after a failed latest push)
#   - workflow_dispatch: backfill or deliberately overwrite (force)

on:
  push:
    branches:
      - main
    paths:
      - "kits/docker-doctor/**"
  pull_request:
    paths:
      - "kits/docker-doctor/**"
  workflow_dispatch:
    inputs:
      latest:
        description: "Also push :latest"
        type: boolean
        default: true
      force:
        description: "Overwrite the tag if it already exists on Docker Hub"
        type: boolean
        default: false

permissions:
  contents: read

env:
  KIT_DIR: ./kits/docker-doctor
  KIT_REPO: docker.io/pungrumpy/docker-doctor-kit

jobs:
  require-changeset:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require spec.yaml to match package.json
        run: bun scripts/sync-kit-spec.ts --check
      - name: Require a changeset when the kit changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          base="$(git show "$BASE_SHA:kits/docker-doctor/package.json" 2>/dev/null | jq -r '.version // empty')"
          head="$(jq -r .version "$KIT_DIR/package.json")"
          if [ "$head" != "$base" ]; then
            echo "Kit version: ${base:-<none>} -> $head (bumped in this PR)"
            exit 0
          fi
          # Read each added changeset from HEAD. An empty list must not pass.
          # `xargs -r grep` skips grep when nothing was added, and the
          # pipeline then exits 0.
          for changeset in $(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- '.changeset/*.md'); do
            if git show "HEAD:$changeset" | grep -qE '^"?docker-doctor-kit"?:'; then
              echo "Found a changeset for docker-doctor-kit: $changeset"
              exit 0
            fi
          done
          echo "::error::This PR changes the kit without a changeset — run \`bunx changeset\` and pick docker-doctor-kit (minor for new behavior, patch for fixes)."
          exit 1

  push:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require spec.yaml to match package.json
        run: bun scripts/sync-kit-spec.ts --check
      - name: Read kit version and CLI pin from spec.yaml
        id: kit
        run: |
          version="$(awk -F'"' '/^version:/ { print $2; exit }' "$KIT_DIR/spec.yaml")"
          cli="$(/usr/bin/grep -oE '@docker-doctor/cli@[[:alnum:]._-]+' "$KIT_DIR/spec.yaml" | head -n1 | cut -d@ -f3)"
          if [ -z "$version" ] || [ -z "$cli" ]; then
            echo "::error::Could not read version ($version) or CLI pin ($cli) from $KIT_DIR/spec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
      # Ask Docker Hub directly. `sbx kit inspect` needs credentials this
      # step does not have, so it failed for existing tags too and the
      # workflow re-pushed 0.1.5 over itself on 2026-09-04.
      #
      # latest is checked as well, so a re-run repairs a run whose version
      # push worked and whose latest push failed. Push times are compared,
      # not digests. `sbx kit push` is not reproducible. 0.1.11 and latest
      # were pushed from the same spec four seconds apart, and their digests
      # differ.
      - name: Decide what to push
        id: plan
        env:
          TAG: ${{ steps.kit.outputs.version }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          WANT_LATEST: ${{ inputs.latest }}
        run: |
          repo_path="${KIT_REPO#docker.io/}"
          # Prints when the tag was last pushed, in epoch seconds, or nothing
          # when the tag does not exist.
          pushed_at() {
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "https://hub.docker.com/v2/repositories/${repo_path}/tags/$1")"
            case "$code" in
              200) date -u -d "$(jq -r .tag_last_pushed "$body")" +%s ;;
              404) ;;
              *)
                echo "::error::Docker Hub returned HTTP $code for ${repo_path}:$1; refusing to guess whether the tag exists." >&2
                return 1
                ;;
            esac
          }
          version_at="$(pushed_at "$TAG")"
          latest_at="$(pushed_at latest)"
          exists=false
          [ -n "$version_at" ] && exists=true
          push_version=false
          if [ "$exists" = false ] || { [ "$EVENT" = workflow_dispatch ] && [ "$FORCE" = true ]; }; then
            push_version=true
          fi
          push_latest=false
          if [ "$EVENT" = push ] || [ "$WANT_LATEST" = true ]; then
            if [ "$push_version" = true ] || [ -z "$latest_at" ] || [ "$latest_at" -lt "$version_at" ]; then
              push_latest=true
            fi
          fi
          push_any=false
          if [ "$push_version" = true ] || [ "$push_latest" = true ]; then
            push_any=true
          fi
          echo "$KIT_REPO:$TAG exists=$exists push_version=$push_version push_latest=$push_latest"
          {
            echo "push_version=$push_version"
            echo "push_latest=$push_latest"
            echo "push_any=$push_any"
          } >> "$GITHUB_OUTPUT"
      - name: Install Docker Sandboxes CLI
        if: ${{ steps.plan.outputs.push_any == 'true' }}
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          # docker-sbx is pinned: 0.39.0 changed `sbx kit push` to read only
          # the sbx credential store, which `docker login` does not populate
          # on a headless runner, so every push since 2026-08-19 failed with
          # "no default account profile set: secret not found". 0.42.0
          # advertises reading `docker login` credentials again — re-test and
          # unpin once it reaches the stable apt channel.
          sudo apt-get install -y "docker-sbx=0.38.0-1~ubuntu.24.04~noble"
      - name: Refuse to overwrite an existing tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.plan.outputs.push_any != 'true' }}
        run: |
          echo "::error::$KIT_REPO:${{ steps.kit.outputs.version }} already exists. Add a changeset for docker-doctor-kit, or re-run with force to overwrite."
          exit 1
      - name: Already published — nothing to do
        if: ${{ github.event_name == 'push' && steps.plan.outputs.push_any != 'true' }}
        run: echo "::notice::$KIT_REPO:${{ steps.kit.outputs.version }} and latest are already on Docker Hub; skipping."
      # A CLI release merges the kit bump and the CLI bump in one commit, so
      # this run races the Release workflow's npm publish. Never ship a kit
      # whose `npm install -g @docker-doctor/cli@X` cannot resolve.
      - name: Wait for the pinned CLI to reach npm
        if: ${{ steps.plan.outputs.push_any == 'true' }}
        env:
          CLI_VERSION: ${{ steps.kit.outputs.cli }}
        run: |
          for attempt in $(seq 1 40); do
            if npm view "@docker-doctor/cli@${CLI_VERSION}" version >/dev/null 2>&1; then
              echo "@docker-doctor/cli@${CLI_VERSION} is on npm."
              exit 0
            fi
            echo "Attempt $attempt/40: @docker-doctor/cli@${CLI_VERSION} not on npm yet; retrying in 30s."
            sleep 30
          done
          echo "::error::@docker-doctor/cli@${CLI_VERSION} never appeared on npm — did the Release workflow fail? Re-run this workflow once it has published."
          exit 1
      - name: Log in to Docker Hub
        if: ${{ steps.plan.outputs.push_any == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate kit
        if: ${{ steps.plan.outputs.push_any == 'true' }}
        run: sbx kit validate "$KIT_DIR"
      - name: Push kit
        if: ${{ steps.plan.outputs.push_version == 'true' }}
        run: sbx kit push "$KIT_DIR" "$KIT_REPO:${{ steps.kit.outputs.version }}"
      - name: Push latest
        if: ${{ steps.plan.outputs.push_latest == 'true' }}
        run: sbx kit push "$KIT_DIR" "$KIT_REPO:latest"
